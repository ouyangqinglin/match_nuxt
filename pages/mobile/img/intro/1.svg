    <g id="页面-1" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <g id="TAB-01大赛简介" transform="translate(1.000000, -1183.000000)">
            <g id="box-大赛组织" transform="translate(-1.000000, 1183.000000)">
                <rect id="白底" fill="#FFFFFF" x="1" y="0" width="750" height="378"></rect>
                <text id="首届“山证杯”量化私募实盘大赛是由山西证" font-family="PingFangSC-Regular, PingFang SC" font-size="26" font-weight="normal" line-spacing="44" fill="#000000">
                    <tspan x="31" y="158">首届“山证杯”量化私募实盘大赛是由山西证券主办，私募排</tspan>
                    <tspan x="31" y="202">排网承办，华锐金融技术、迅投协办，财联社提供战略媒体</tspan>
                    <tspan x="31" y="246">支持的全国性私募实盘大赛。山西证券希望以此次大赛为契</tspan>
                    <tspan x="31" y="290">机，挖掘、孵化、培育一批优秀量化私募基金管理人，为其</tspan>
                    <tspan x="31" y="334">赋能，助其成长，共创未来。</tspan>
                </text>
